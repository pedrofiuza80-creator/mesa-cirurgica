<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa Cirúrgica 3D — Treino de Instrumentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11161f; --panel:#171e2a; --panel2:#1d2635; --line:#283244;
    --text:#e9eef5; --muted:#97a3b6; --accent:#3fd0b0; --accent2:#2aa38a;
    --ok:#3fd08a; --bad:#ef6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:10px 16px;border-bottom:1px solid var(--line);background:#0d1219}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px}
  .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#2b7fd0);color:#0d1219;font-weight:800;font-size:18px}
  nav{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line)}
  nav button{background:transparent;color:var(--muted);border:0;padding:8px 14px;border-radius:7px;
    font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  nav button:hover{color:var(--text)}
  nav button.active{background:var(--accent);color:#0b1a17}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0;overflow:hidden}
  #c{display:block;width:100%;height:100%;outline:none}
  aside{width:370px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:20px}
  h2{font-size:18px;margin:0 0 6px}
  h3{font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  p{line-height:1.55;margin:0 0 10px;color:#c9d2df}
  .muted{color:var(--muted)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:600;color:#0d1219}
  .legend{display:grid;gap:6px}
  .legend div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#c9d2df}
  .dot{width:10px;height:10px;border-radius:3px;margin-top:4px;flex-shrink:0}
  .btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;font:inherit;font-weight:600;
    cursor:pointer;transition:.15s}
  .btn:hover{border-color:#3a4760;background:#222c3d}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1a17}
  .btn.primary:hover{background:#56dcbf}
  .btn.block{width:100%}
  .opts{display:grid;gap:8px;margin-top:12px}
  .opt{text-align:left;justify-content:flex-start;font-weight:500}
  .opt.right{background:rgba(63,208,138,.16);border-color:var(--ok)}
  .opt.wrong{background:rgba(239,107,107,.16);border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .row{display:flex;gap:8px;margin-top:12px}
  .row .btn{flex:1}
  label.check{display:flex;gap:8px;align-items:center;margin-top:12px;color:#c9d2df;cursor:pointer}
  .foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
  .stars{font-size:28px;letter-spacing:4px;color:#f2c14e}
  ul.miss{margin:6px 0 0;padding-left:18px;color:#c9d2df;line-height:1.6}
  #hint{position:absolute;left:14px;bottom:12px;background:rgba(13,18,25,.78);border:1px solid var(--line);
    padding:7px 11px;border-radius:8px;font-size:12px;color:var(--muted);pointer-events:none}
  #tip{position:absolute;pointer-events:none;background:#0d1219;border:1px solid var(--line);color:var(--text);
    padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;display:none;
    transform:translate(14px,14px)}
  #toast{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-8px);opacity:0;
    background:#0d1219;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-weight:600;
    transition:.25s;pointer-events:none;max-width:80%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:var(--ok)} #toast.bad{border-color:var(--bad)}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg);text-align:center;padding:20px}
  @media (max-width:900px){ main{flex-direction:column} aside{width:auto;height:45%;border-left:0;border-top:1px solid var(--line)} }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="app">
  <header>
    <div class="brand"><div class="logo">✚</div><div>Mesa Cirúrgica 3D<small>Protótipo · treino de instrumentação</small></div></div>
    <nav>
      <button data-mode="explorar" class="active">Explorar a mesa</button>
      <button data-mode="quiz">Quiz</button>
      <button data-mode="montar">Montar a mesa</button>
    </nav>
  </header>
  <main>
    <div id="stage">
      <canvas id="c" tabindex="0"></canvas>
      <div id="hint"></div>
      <div id="tip"></div>
      <div id="toast"></div>
      <div id="loading">Carregando a mesa 3D…</div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

<script>
  setTimeout(function(){
    if(!window.__mesaOk){
      var l=document.getElementById('loading');
      if(l) l.innerHTML='Não foi possível carregar o 3D.<br>Verifique a conexão e recarregue a página.';
    }
  }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- Conteúdo ---------------- */
const CATS = {
  dierese:     { nome:'Diérese',        cor:'#e86a6a', desc:'Cortar e separar tecidos.' },
  preensao:    { nome:'Preensão',       cor:'#e6a64e', desc:'Segurar e manipular tecidos.' },
  hemostasia:  { nome:'Hemostasia',     cor:'#5a9ae8', desc:'Pinçar vasos e controlar o sangramento.' },
  afastamento: { nome:'Afastamento',    cor:'#a27ae0', desc:'Afastar bordas e estruturas para expor o campo operatório.' },
  sintese:     { nome:'Síntese',        cor:'#45c294', desc:'Aproximar e fechar tecidos (sutura).' },
  especiais:   { nome:'Especiais',      cor:'#94a0b4', desc:'Uso específico, como fixar campos ou fazer a antissepsia.' },
};
const ZONE_ORDER = ['dierese','preensao','hemostasia','afastamento','sintese','especiais'];

const INSTR = [
  { id:'bisturi', nome:'Cabo de bisturi nº 4 com lâmina', cat:'dierese',
    uso:'Incisão da pele e dos tecidos. O cabo nº 3 recebe lâminas pequenas (10 a 15) e o nº 4 recebe as maiores (20 a 25).',
    dica:'Cabo achatado com área serrilhada para a empunhadura; a lâmina encaixa na ponta.' },
  { id:'mayo', nome:'Tesoura de Mayo', cat:'dierese',
    uso:'Tesoura robusta para tecidos mais resistentes, como a aponeurose.',
    dica:'Lâminas largas e grossas, longas em relação ao cabo.' },
  { id:'metzenbaum', nome:'Tesoura de Metzenbaum', cat:'dierese',
    uso:'Tesoura delicada para dissecção de tecidos finos.',
    dica:'Cabo longo e lâminas curtas e finas, geralmente curvas.' },
  { id:'anatomica', nome:'Pinça anatômica', cat:'preensao',
    uso:'Pinça de dissecção sem dentes, para tecidos delicados como vasos e vísceras.',
    dica:'Ponta com estrias finas e sem dentes.' },
  { id:'denterato', nome:'Pinça dente de rato', cat:'preensao',
    uso:'Pinça com dentes na ponta, para tecidos firmes como pele e aponeurose.',
    dica:'Olhe a ponta de perto: dentes que se encaixam (padrão 1×2).' },
  { id:'allis', nome:'Pinça de Allis', cat:'preensao',
    uso:'Pinça de preensão com cremalheira, que segura tecidos e bordas com firmeza.',
    dica:'Hastes finas terminando numa ponta alargada com pequenos dentes.' },
  { id:'kelly', nome:'Pinça de Kelly', cat:'hemostasia',
    uso:'Pinça hemostática de tamanho médio para pinçar vasos.',
    dica:'Ranhuras transversais só na metade distal da ponta; pode ser reta ou curva.' },
  { id:'halsted', nome:'Pinça de Halsted (mosquito)', cat:'hemostasia',
    uso:'Pinça hemostática pequena e delicada, para vasos de pequeno calibre.',
    dica:'Menor e mais fina que a Kelly, com ranhuras em toda a ponta.' },
  { id:'farabeuf', nome:'Afastador de Farabeuf', cat:'afastamento',
    uso:'Afastador manual, usado em par, para afastar as bordas da ferida em planos superficiais.',
    dica:'Lâmina chata dobrada nas duas extremidades, com pontas de tamanhos diferentes.' },
  { id:'doyen', nome:'Válvula de Doyen', cat:'afastamento',
    uso:'Afasta a parede abdominal em cirurgias abdominais e pélvicas.',
    dica:'Uma única lâmina larga presa a um cabo.' },
  { id:'portaagulha', nome:'Porta-agulha de Mayo-Hegar', cat:'sintese',
    uso:'Segura a agulha com firmeza durante a sutura.',
    dica:'Mordente curto e robusto; os modelos com inserto de tungstênio têm argolas douradas.' },
  { id:'agulha', nome:'Agulha curva com fio', cat:'sintese',
    uso:'Agulha cirúrgica já montada com o fio, usada na sutura.',
    dica:'Agulha em arco (cerca de 3/8 de círculo) presa ao fio.' },
  { id:'backhaus', nome:'Pinça de Backhaus', cat:'especiais',
    uso:'Pinça de campo: fixa os campos operatórios entre si ou à pele.',
    dica:'Pontas curvas e perfurantes que se encontram.' },
  { id:'cheron', nome:'Pinça de Cheron', cat:'especiais',
    uso:'Pinça longa usada na antissepsia, segurando a gaze com o antisséptico.',
    dica:'Bem longa, com a ponta em forma de anel ovalado.' },
];

/* ---------------- Cena ---------------- */
const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141b26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 1.2;
controls.maxDistance = 24;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3546, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(3, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-11, right:11, top:11, bottom:-11, near:1, far:40 });
sun.shadow.bias = -0.0004;
scene.add(sun);

function onResize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe(stage);

/* ---------------- Utilitários de geometria ---------------- */
const MAT = {
  steel: () => new THREE.MeshStandardMaterial({ color:0xe2e6eb, metalness:0.72, roughness:0.3 }),
  dark:  () => new THREE.MeshStandardMaterial({ color:0x6d747e, metalness:0.6, roughness:0.5 }),
  gold:  () => new THREE.MeshStandardMaterial({ color:0xd9ab4e, metalness:1, roughness:0.25 }),
  blade: () => new THREE.MeshStandardMaterial({ color:0xf0f3f6, metalness:0.85, roughness:0.12 }),
  suture:() => new THREE.MeshStandardMaterial({ color:0x2b4fd0, roughness:0.55 }),
};
function mesh(geo, mat){ const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
// Placa plana desenhada vista de cima: pontos [x, z]
function plate(pts, thick, mat, y = 0){
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thick, bevelEnabled: true, bevelThickness: thick * 0.3,
    bevelSize: Math.min(thick * 0.3, 0.008), bevelSegments: 2, curveSegments: 16 });
  geo.rotateX(-Math.PI / 2);
  const m = mesh(geo, mat); m.position.y = y; return m;
}
function bar(a, b, w, h, mat, y = 0){
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
  const m = mesh(new THREE.BoxGeometry(len, h, w), mat);
  m.position.set((a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2);
  m.rotation.y = Math.atan2(-dz, dx);
  return m;
}
function ring(x, z, r, tube, mat, y = 0){
  const g = new THREE.TorusGeometry(r, tube, 12, 40); g.rotateX(Math.PI / 2);
  const m = mesh(g, mat); m.position.set(x, y, z); return m;
}
function box(w, h, d, mat, x, y, z){ const m = mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; }

/* Instrumentos de argola (tesouras, pinças hemostáticas, porta-agulha...) */
function ringInstrument(o){
  const g = new THREE.Group();
  const m = MAT.steel(), rm = o.gold ? MAT.gold() : m, dk = MAT.dark();
  const L = o.L, jawLen = o.jawLen, rr = o.ringR ?? 0.12, tube = o.tube ?? 0.024, sep = o.sep ?? 0.16, y = 0.04;
  const px = L - jawLen;
  for (const s of [-1, 1]){
    const cx = rr + tube, cz = s * sep;
    g.add(ring(cx, cz, rr, tube, rm, y));
    const a = [cx + rr * 0.85, cz - s * rr * 0.45];
    const b = [px - 0.02, s * 0.012];
    g.add(bar(a, b, o.shankW ?? 0.045, 0.034, m, y));
    if (o.ratchet){
      const x0 = a[0] + 0.07;
      const zAt = a[1] + (x0 - a[0]) / (b[0] - a[0]) * (b[1] - a[1]);
      for (let k = 0; k < 3; k++) g.add(box(0.022, 0.03, 0.05, dk, x0 + k * 0.035, y, zAt - s * 0.035));
    }
  }
  g.add(box(0.13, 0.06, 0.1, m, px, y, 0));
  const screw = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.07, 16), dk);
  screw.position.set(px, y + 0.005, 0); g.add(screw);
  o.jaw(g, px, { m, dk, y });
  return g;
}
function hemostatJaw({ jl, w, curve = 0, serr = 'full' }){
  return (g, px, { m, dk, y }) => {
    const c = curve;
    g.add(plate([[px,-w/2],[px+jl*0.5,-w*0.42+c*0.3],[px+jl*0.92,-w*0.28+c*0.85],[px+jl,c],
                 [px+jl*0.92,w*0.28+c*0.85],[px+jl*0.5,w*0.42+c*0.3],[px,w/2]], 0.03, m, y - 0.015));
    const t0 = serr === 'half' ? 0.5 : 0.12, n = serr === 'half' ? 6 : 10;
    for (let i = 0; i < n; i++){
      const t = t0 + (0.9 - t0) * i / (n - 1);
      const zc = t < 0.5 ? c * t * 0.6 : c * (0.3 + (t - 0.5) * 1.1);
      g.add(box(0.008, 0.006, w * (0.85 - 0.45 * t), dk, px + t * jl, y + 0.024, zc));
    }
  };
}
function scissorJaw({ jl, w, curve = 0 }){
  return (g, px, { dk, y }) => {
    const c = curve;
    g.add(plate([[px,-w/2],[px+jl*0.6,-w*0.38+c*0.4],[px+jl*0.93,-w*0.2+c*0.9],[px+jl,c],
                 [px+jl*0.93,w*0.2+c*0.9],[px+jl*0.6,w*0.38+c*0.4],[px,w/2]], 0.028, MAT.blade(), y - 0.014));
    const seg = [[px,0],[px+jl*0.6,c*0.4],[px+jl*0.95,c*0.92]];
    for (let i = 0; i < seg.length - 1; i++) g.add(bar(seg[i], seg[i+1], 0.006, 0.004, dk, y + 0.024));
  };
}
function needleJaw(jl, w){
  return (g, px, { m, dk, y }) => {
    g.add(plate([[px,-w/2],[px+jl*0.85,-w*0.45],[px+jl,-w*0.25],[px+jl,w*0.25],[px+jl*0.85,w*0.45],[px,w/2]], 0.034, m, y - 0.017));
    g.add(box(jl * 0.7, 0.006, w * 0.6, dk, px + jl * 0.55, y + 0.028, 0));
  };
}
function allisJaw(jl){
  return (g, px, { m, dk, y }) => {
    const tx = px + jl;
    g.add(bar([px,-0.02],[tx-0.03,-0.012], 0.022, 0.022, m, y));
    g.add(bar([px, 0.02],[tx-0.03, 0.012], 0.022, 0.022, m, y));
    g.add(box(0.035, 0.03, 0.11, m, tx - 0.015, y, 0));
    for (let i = 0; i < 5; i++) g.add(box(0.014, 0.02, 0.012, dk, tx + 0.006, y, -0.044 + i * 0.022));
  };
}
function backhausJaw(){
  return (g, px, { m, y }) => {
    const r = 0.14, cx = px + r;
    for (const s of [1, -1]){
      const geo = new THREE.TorusGeometry(r, 0.018, 10, 32, Math.PI - 0.12); geo.rotateX(Math.PI / 2);
      const a = mesh(geo, m); a.position.set(cx, y, 0); a.rotation.y = Math.PI; a.scale.z = s; g.add(a);
    }
  };
}
function cheronJaw(jl){
  return (g, px, { m, y }) => {
    const tx = px + jl;
    g.add(bar([px,0],[tx-0.2,0], 0.035, 0.03, m, y));
    const geo = new THREE.TorusGeometry(0.07, 0.016, 10, 32); geo.rotateX(Math.PI / 2);
    const o = mesh(geo, m); o.position.set(tx - 0.11, y, 0); o.scale.x = 1.6; g.add(o);
  };
}
function forceps({ L, teeth }){
  const g = new THREE.Group(), m = MAT.steel(), dk = MAT.dark();
  const pts = [[0,-0.042],[L*0.5,-0.05],[L*0.92,-0.02],[L,-0.012],[L,0.012],[L*0.92,0.02],[L*0.5,0.05],[0,0.042]];
  g.add(plate(pts, 0.018, m, 0.005));
  const top = new THREE.Group(); top.position.set(0, 0.03, 0); top.rotation.z = 0.055; g.add(top);
  top.add(plate(pts, 0.018, m, 0));
  g.add(box(0.1, 0.05, 0.085, m, 0.05, 0.03, 0));
  for (let i = 0; i < 9; i++) top.add(box(0.01, 0.008, 0.075, dk, L * 0.38 + i * 0.035, 0.026, 0));
  if (teeth){
    for (const z of [-0.009, 0.009]){
      const t = mesh(new THREE.ConeGeometry(0.009, 0.045, 8), dk); t.position.set(L - 0.01, 0.045, z); g.add(t);
    }
    const t2 = mesh(new THREE.ConeGeometry(0.01, 0.045, 8), dk); t2.rotation.x = Math.PI; t2.position.set(L - 0.01, -0.012, 0); top.add(t2);
  } else {
    for (let i = 0; i < 6; i++) top.add(box(0.006, 0.006, 0.022, dk, L - 0.02 - i * 0.018, 0.026, 0));
  }
  return g;
}
function scalpel(){
  const g = new THREE.Group(), m = MAT.steel(), dk = MAT.dark();
  g.add(plate([[0,-0.05],[0.9,-0.056],[1.0,-0.034],[1.16,-0.024],[1.16,0.024],[1.0,0.034],[0.9,0.056],[0,0.05]], 0.035, m, 0.005));
  for (let i = 0; i < 12; i++) g.add(box(0.012, 0.008, 0.085, dk, 0.2 + i * 0.045, 0.047, 0));
  g.add(plate([[1.1,-0.034],[1.64,-0.038],[1.52,0.025],[1.4,0.062],[1.24,0.07],[1.12,0.05]], 0.007, MAT.blade(), 0.02));
  return g;
}
function farabeuf(){
  const g = new THREE.Group();
  g.add(plate([[-0.14,-0.30],[-0.14,0.055],[1.44,0.055],[1.44,-0.40],[1.26,-0.40],[1.26,-0.055],[0.04,-0.055],[0.04,-0.30]], 0.025, MAT.steel(), 0.005));
  return g;
}
function doyen(){
  const g = new THREE.Group(), m = MAT.steel();
  g.add(plate([[0,-0.045],[1.05,-0.045],[1.05,-0.28],[1.5,-0.30],[1.58,-0.2],[1.58,0.2],[1.5,0.30],[1.05,0.28],[1.05,0.045],[0,0.045]], 0.025, m, 0.005));
  const grip = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.55, 20), MAT.dark());
  grip.rotation.z = Math.PI / 2; grip.position.set(0.32, 0.06, 0); g.add(grip);
  return g;
}
function needle(){
  const g = new THREE.Group(), m = MAT.steel();
  const r = 0.17;
  const geo = new THREE.TorusGeometry(r, 0.012, 8, 40, Math.PI * 0.75); geo.rotateX(Math.PI / 2);
  const n = mesh(geo, m); n.position.y = 0.02; g.add(n);
  const sw = mesh(new THREE.CylinderGeometry(0.017, 0.014, 0.06, 12), m);
  sw.rotation.x = Math.PI / 2; sw.position.set(r, 0.02, -0.03); g.add(sw);
  const pts = [[r,-0.06],[r+0.05,-0.3],[r-0.15,-0.55],[r+0.25,-0.78],[r+0.6,-0.7],[r+0.9,-0.45],[r+1.15,-0.6]]
    .map(([x, z]) => new THREE.Vector3(x, 0.02, z));
  g.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 140, 0.011, 8, false), MAT.suture()));
  return g;
}

/* ---------------- Mesa, zonas, bandeja, pedestal ---------------- */
const ZW = 2.6, ZD = 2.0;
function zoneCenter(i){ const col = i % 3, row = Math.floor(i / 3); return new THREE.Vector3((col - 1) * 2.8, 0, row === 0 ? -1.1 : 1.1); }

const mesa = new THREE.Group(); scene.add(mesa);
mesa.add(box(9.0, 0.2, 5.0, new THREE.MeshStandardMaterial({ color:0xb7bec7, metalness:0.7, roughness:0.45 }), 0, -0.1, 0));
const drape = mesh(new THREE.PlaneGeometry(8.8, 4.8), new THREE.MeshStandardMaterial({ color:0x2e7466, roughness:0.95 }));
drape.rotation.x = -Math.PI / 2; drape.position.y = 0.002; drape.castShadow = false; mesa.add(drape);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color:0x19202b, roughness:1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -1.2; floor.receiveShadow = true; scene.add(floor);

function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function zoneTexture(cat, i){
  const W = 1040, H = 800, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), col = CATS[cat].cor;
  x.fillStyle = 'rgba(255,255,255,0.06)'; roundRect(x, 8, 8, W - 16, H - 16, 40); x.fill();
  x.setLineDash([30, 18]); x.lineWidth = 8; x.strokeStyle = col; roundRect(x, 8, 8, W - 16, H - 16, 40); x.stroke(); x.setLineDash([]);
  const label = `${i + 1}. ${CATS[cat].nome}`;
  x.font = '700 58px Inter, system-ui, sans-serif';
  const tw = x.measureText(label).width;
  x.fillStyle = col; roundRect(x, 34, 30, tw + 64, 90, 45); x.fill();
  x.fillStyle = '#0d1219'; x.fillText(label, 66, 96);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const zones = {};
ZONE_ORDER.forEach((cat, i) => {
  const c = zoneCenter(i);
  const geo = new THREE.PlaneGeometry(ZW, ZD); geo.rotateX(-Math.PI / 2);
  const z = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:zoneTexture(cat, i), transparent:true, roughness:1 }));
  z.position.set(c.x, 0.005, c.z); z.receiveShadow = true; z.userData.zone = cat;
  const flash = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, depthWrite:false }));
  flash.position.set(c.x, 0.008, c.z);
  mesa.add(z); mesa.add(flash);
  zones[cat] = { mesh:z, flash, f:0 };
});

const TRAY_Z = 5.3;
const tray = new THREE.Group(); scene.add(tray);
{
  const tm = new THREE.MeshStandardMaterial({ color:0xc9d0d8, metalness:0.85, roughness:0.3 });

  tray.add(box(9.0, 0.16, 0.1, tm, 0, 0.02, TRAY_Z + 2.3));

  tray.add(box(0.1, 0.16, 4.6, tm, 4.5, 0.02, TRAY_Z));
}
const traySlots = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) traySlots.push(new THREE.Vector3((c - 1) * 2.9, 0, TRAY_Z + (r - 2) * 0.84));

const pedestal = new THREE.Group(); scene.add(pedestal);
{

  p.position.y = 0.15; pedestal.add(p);

const PED_Y = 0.32;

/* ---------------- Objetos dos instrumentos ---------------- */
const objs = INSTR.map(d => {
  const inner = BUILD[d.id]();
  const bb = new THREE.Box3().setFromObject(inner);
  const c = bb.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -bb.min.y, -c.z);
  const g = new THREE.Group(); g.add(inner); scene.add(g);
  const mats = new Set(); g.traverse(o => { if (o.isMesh) mats.add(o.material); });
  const sz = bb.getSize(new THREE.Vector3());
  const hit = new THREE.Mesh(new THREE.BoxGeometry(sz.x + 0.08, 0.14, Math.max(sz.z, 0.12) + 0.08),
    new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false }));
  hit.position.y = 0.07; g.add(hit);
  const o = { d, g, mats:[...mats], len: bb.max.x - bb.min.x, tp:new THREE.Vector3(), tr:0, ts:1, lift:0, glow:-1, placed:false };
  g.userData.obj = o;
  return o;
});
const byCat = {}; ZONE_ORDER.forEach(c => byCat[c] = objs.filter(o => o.d.cat === c));
function zoneSlot(cat, k){
  const n = byCat[cat].length, c = zoneCenter(ZONE_ORDER.indexOf(cat));
  return new THREE.Vector3(c.x, 0, c.z + 0.15 + (k - (n - 1) / 2) * 0.58);
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const legendHTML = () => `<div class="legend">${ZONE_ORDER.map((c, i) =>

/* ---------------- Modos ---------------- */
let mode = null, selected = null, hovered = null;

function normalizeRot(){
  for (const o of objs){ const r = ((o.g.rotation.y % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); o.g.rotation.y = r > Math.PI ? r - 2 * Math.PI : r; o.tr = 0; }
}
function layoutMesa(){
  for (const cat of ZONE_ORDER) byCat[cat].forEach((o, k) => { o.tp.copy(zoneSlot(cat, k)); o.tr = 0; o.ts = 1; o.lift = 0; o.g.visible = true; });
}

function setMode(m){
  mode = m; selected = null; hovered = null; tipEl.style.display = 'none';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  normalizeRot();
  mesa.visible = m !== 'quiz'; tray.visible = m === 'montar'; pedestal.visible = m === 'quiz';
  clearInterval(montar.timer);
  if (m === 'explorar') startExplore();
  if (m === 'quiz') startQuiz();
  if (m === 'montar') startMontar();
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

/* --- Quiz --- */
const quiz = { q:[], i:0, score:0, answered:false, missed:[], cur:null };
function getBest(){ try { return +localStorage.getItem('mesa3d_best') || 0; } catch { return 0; } }
function setBest(v){ try { localStorage.setItem('mesa3d_best', String(v)); } catch {} }
function startQuiz(){
  quiz.q = shuffle(objs).slice(0, 10).map(o => ({ o, type: Math.random() < 0.7 ? 'nome' : 'tempo' }));
  quiz.i = 0; quiz.score = 0; quiz.missed = [];
  flyTo(new THREE.Vector3(0, 2.7, 3.7), new THREE.Vector3(0, 0.45, 0));
  hintEl.textContent = 'Arraste para girar o instrumento · role para aproximar';
  showQuestion();
}
function showQuestion(){
  const item = quiz.q[quiz.i]; quiz.answered = false; quiz.cur = item.o;
  for (const o of objs){ o.g.visible = o === item.o; o.lift = 0; }
  const o = item.o;
  o.tp.set(0, PED_Y, 0); o.ts = Math.min(1.9, 2.5 / o.len);
  o.g.position.set(0, PED_Y + 1.2, 0); o.g.scale.setScalar(o.ts * 0.6); o.g.rotation.y = 0; o.tr = 0;
  let opts;
  if (item.type === 'nome'){
    const same = shuffle(byCat[o.d.cat].filter(x => x !== o)).slice(0, 2);
    const rest = shuffle(objs.filter(x => x !== o && !same.includes(x))).slice(0, 3 - same.length);
    opts = shuffle([o, ...same, ...rest]).map(x => ({ v:x.d.id, t:x.d.nome }));
  } else {
    const others = shuffle(ZONE_ORDER.filter(c => c !== o.d.cat)).slice(0, 3);
    opts = shuffle([o.d.cat, ...others]).map(c => ({ v:c, t:CATS[c].nome }));
  }
  const correct = item.type === 'nome' ? o.d.id : o.d.cat;
  const pct = (quiz.i / quiz.q.length) * 100;
  panel.innerHTML = `<h2>Quiz</h2>
    <p class="muted">Pergunta ${quiz.i + 1} de ${quiz.q.length} · Acertos: ${quiz.score}</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card"><b>${item.type === 'nome' ? 'Qual é este instrumento?' : 'A que tempo cirúrgico pertence este instrumento?'}</b>
    <div class="opts">${opts.map(op => `<button class="btn opt" data-v="${op.v}">${op.t}</button>`).join('')}</div></div>
    <div id="fb"></div>${FOOT}`;
  panel.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (quiz.answered) return; quiz.answered = true;
    const ok = b.dataset.v === correct;
    if (ok) quiz.score++; else quiz.missed.push(o.d);
    panel.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === correct) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    toast(ok ? 'Acertou!' : 'Não foi dessa vez', ok ? 'ok' : 'bad');
    const last = quiz.i === quiz.q.length - 1;
    document.getElementById('fb').innerHTML = infoCard(o.d) +
      `<div class="row"><button class="btn primary" id="next">${last ? 'Ver resultado' : 'Próxima'}</button></div>`;
    document.getElementById('next').onclick = () => { if (last) finishQuiz(); else { quiz.i++; showQuestion(); } };
  });
}
function finishQuiz(){
  const best = Math.max(getBest(), quiz.score); setBest(best);
  const n = quiz.q.length;
  const stars = quiz.score >= 9 ? '★★★' : quiz.score >= 6 ? '★★☆' : '★☆☆';
  panel.innerHTML = `<h2>Resultado do quiz</h2>
    <div class="card" style="text-align:center"><div class="stars">${stars}</div>
    <h2 style="margin-top:6px">${quiz.score} de ${n}</h2><p class="muted" style="margin:0">Melhor resultado: ${best} de ${n}</p></div>
    ${quiz.missed.length ? `<h3>Para revisar</h3><ul class="miss">${quiz.missed.map(d => `<li>${d.nome} <span class="muted">(${CATS[d.cat].nome})</span></li>`).join('')}</ul>` : '<p style="margin-top:14px">Gabaritou! 🎉</p>'}
    <div class="row"><button class="btn primary" id="again">Jogar de novo</button><button class="btn" id="toExp">Explorar a mesa</button></div>${FOOT}`;
  document.getElementById('again').onclick = () => startQuiz();
  document.getElementById('toExp').onclick = () => setMode('explorar');
}

/* --- Montar a mesa --- */
const montar = { errors:0, start:0, done:false, count:{}, timer:null, names:true, missed:new Set() };
function startMontar(){
  montar.errors = 0; montar.done = false; montar.missed = new Set();
  ZONE_ORDER.forEach(c => montar.count[c] = 0);
  const slots = shuffle(traySlots);
  objs.forEach((o, i) => {
    o.placed = false; o.g.visible = true; o.lift = 0; o.ts = 1;
    o.tp.copy(slots[i]).add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.12));
    o.tr = (Math.random() - 0.5) * 0.35 + (Math.random() < 0.5 ? Math.PI : 0);
  });
  montar.start = performance.now();
  flyTo(new THREE.Vector3(0, 14.5, 12.2), new THREE.Vector3(0, 0, 3.1));
  hintEl.textContent = 'Clique em um instrumento da bandeja e depois na área correta da mesa';
  renderMontar();
  clearInterval(montar.timer);
  montar.timer = setInterval(() => { const t = document.getElementById('timer'); if (t && !montar.done) t.textContent = fmtTime((performance.now() - montar.start) / 1000); }, 500);
}
function placedTotal(){ return objs.filter(o => o.placed).length; }
function renderMontar(){
  const n = placedTotal(), total = objs.length;
  if (montar.done){
    const secs = (performance.now() - montar.start) / 1000;
    const stars = montar.errors === 0 ? '★★★' : montar.errors <= 3 ? '★★☆' : '★☆☆';
    panel.innerHTML = `<h2>Mesa montada!</h2>
      <div class="card" style="text-align:center"><div class="stars">${stars}</div>
      <p style="margin:8px 0 0">Tempo: <b>${fmtTime(montar.finalSecs ?? secs)}</b> · Erros: <b>${montar.errors}</b></p></div>
      ${montar.missed.size ? `<h3>Instrumentos em que você errou</h3><ul class="miss">${[...montar.missed].map(d => `<li>${d.nome} → <b>${CATS[d.cat].nome}</b></li>`).join('')}</ul>` : ''}
      <div class="row"><button class="btn primary" id="again">Montar de novo</button><button class="btn" id="toQuiz">Fazer o quiz</button></div>${FOOT}`;
    document.getElementById('again').onclick = () => startMontar();
    document.getElementById('toQuiz').onclick = () => setMode('quiz');
    return;
  }
  panel.innerHTML = `<h2>Montar a mesa</h2>
    <p>Os instrumentos estão bagunçados na bandeja. Clique em um deles e depois na área da mesa onde ele deve ficar.</p>
    <div class="stats"><div class="stat"><b>${n}/${total}</b><span>Na mesa</span></div>
      <div class="stat"><b id="timer">${fmtTime((performance.now() - montar.start) / 1000)}</b><span>Tempo</span></div>
      <div class="stat"><b>${montar.errors}</b><span>Erros</span></div></div>
    <div class="bar"><i style="width:${(n / total) * 100}%"></i></div>
    ${selected ? `<div class="card"><span class="muted">Selecionado:</span><h2 style="margin:4px 0 0">${montar.names ? selected.d.nome : 'Instrumento misterioso'}</h2></div>` : `<div class="card muted">Nenhum instrumento selecionado.</div>`}
    <label class="check"><input type="checkbox" id="names" ${montar.names ? 'checked' : ''}> Mostrar o nome do instrumento (desligue para o modo desafio)</label>
    <div class="row"><button class="btn" id="reshuffle">Recomeçar</button></div>
    <h3>Áreas da mesa</h3>${legendHTML()}${FOOT}`;
  document.getElementById('names').onchange = e => { montar.names = e.target.checked; renderMontar(); };
  document.getElementById('reshuffle').onclick = () => { selected = null; startMontar(); };
}
function clickMontar(o, zoneCat){
  if (montar.done) return;
  if (o && !o.placed){
    if (selected) selected.lift = 0;
    selected = (selected === o) ? null : o;
    if (selected) selected.lift = 0.35;
    renderMontar(); return;
  }
  if (o && o.placed) zoneCat = o.d.cat;
  if (!zoneCat) return;
  if (!selected){ toast('Primeiro escolha um instrumento na bandeja'); return; }
  const s = selected;
  if (s.d.cat === zoneCat){
    s.placed = true; s.lift = 0; s.tr = 0;
    s.tp.copy(zoneSlot(zoneCat, montar.count[zoneCat]++));
    zones[zoneCat].flash.material.color.set(0x3fd08a); zones[zoneCat].f = 0.55;
    toast(`✓ ${montar.names ? s.d.nome : 'Correto'} → ${CATS[zoneCat].nome}`, 'ok');
    selected = null;
    if (placedTotal() === objs.length){ montar.done = true; montar.finalSecs = (performance.now() - montar.start) / 1000; clearInterval(montar.timer); }
  } else {
    montar.errors++; montar.missed.add(s.d);
    zones[zoneCat].flash.material.color.set(0xef5b5b); zones[zoneCat].f = 0.55;
    toast(`✗ Esse instrumento não é de ${CATS[zoneCat].nome}`, 'bad');
  }
  renderMontar();
}

/* ---------------- Interação ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hits(ev, targets){
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(targets, true);
}
function objFrom(h){ let o = h.object; while (o && !o.userData.obj) o = o.parent; return o ? o.userData.obj : null; }
function pickables(){ return objs.filter(o => o.g.visible).map(o => o.g); }

let down = null;
canvas.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
  down = null;
  if (mode === 'quiz') return;
  const targets = pickables();
  if (mode === 'montar') targets.push(...ZONE_ORDER.map(c => zones[c].mesh));
  const h = hits(e, targets)[0];
  if (!h){ if (mode === 'montar') clickMontar(null, null); return; }
  const o = objFrom(h), zoneCat = h.object.userData.zone;
  if (mode === 'explorar') clickExplore(o);
  else if (mode === 'montar') clickMontar(o, zoneCat);
});
canvas.addEventListener('pointermove', e => {
  if (mode === 'quiz' || e.buttons) { hovered = null; tipEl.style.display = 'none'; return; }
  const h = hits(e, pickables())[0];
  hovered = h ? objFrom(h) : null;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  const showName = hovered && (mode === 'explorar' || (mode === 'montar' && montar.names));
  if (showName){
    const r = stage.getBoundingClientRect();
    tipEl.textContent = hovered.d.nome; tipEl.style.display = 'block';
    tipEl.style.left = (e.clientX - r.left) + 'px'; tipEl.style.top = (e.clientY - r.top) + 'px';
  } else tipEl.style.display = 'none';
});
canvas.addEventListener('pointerleave', () => { hovered = null; tipEl.style.display = 'none'; });

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
const GLOW = [0x000000, 0x1d3550, 0x1c6656];
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = 1 - Math.exp(-dt * 9);
  if (mode === 'quiz' && quiz.cur) quiz.cur.tr += dt * 0.5;
  for (const o of objs){
    const t = o.tp.clone(); t.y += o.lift + (o.lift ? Math.sin(performance.now() / 300) * 0.03 : 0);
    o.g.position.lerp(t, k);
    o.g.rotation.y += (o.tr - o.g.rotation.y) * k;
    o.g.scale.setScalar(o.g.scale.x + (o.ts - o.g.scale.x) * k);
    const gl = o === selected ? 2 : o === hovered ? 1 : 0;
    if (gl !== o.glow){ o.glow = gl; for (const m of o.mats){ m.emissive.setHex(GLOW[gl]); } }
  }
  for (const c of ZONE_ORDER){ const z = zones[c]; if (z.f > 0){ z.f = Math.max(0, z.f - dt * 0.9); } z.flash.material.opacity = z.f * 0.6; }
  if (fly){
    camera.position.lerp(fly.pos, 1 - Math.exp(-dt * 4));
    controls.target.lerp(fly.target, 1 - Math.exp(-dt * 4));
    if (camera.position.distanceTo(fly.pos) < 0.01) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

camera.position.set(0, 9, 9); controls.target.set(0, 0, 0);
onResize();
setMode('explorar');
tick();
window.__mesaOk = true;
document.getElementById('loading').remove();
</script>
